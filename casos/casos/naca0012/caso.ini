# NACA0012: curva costo–precisión con Nektar++. Protocolo en TESIS/CURVA_COSTO_PRECISION.md.

[caso]
solver = nektar
id     = nek_{stab}_M{mach}_L{level}_P{P}

[sweep]
stab  = dg av
mach  = 0.4 0.8 1.2 1.8 3.0     # cuatro compartidos con el Aconcagua
level = 0 1 2 3
P     = 2 3 4 5

[values]
# Estado impuesto: T, rho y mu fijos; U sale del Mach; Re sale de los tres.
T        = PENDIENTE
rho      = PENDIENTE
mu       = PENDIENTE
gamma    = 1.4
Rgas     = 287.058
Pr       = 0.72
lref     = 1.0
aref     = lref                 # 2D: fuerza por unidad de envergadura
alpha    = 1.25
p        = rho*Rgas*T
c        = sqrt(gamma*Rgas*T)
U        = mach*c
Re       = rho*U*lref/mu

# Numérica. Implícito + HLL (C3). El implícito sólo acepta Physical como viscosidad artificial.
nummodes = P + 1
flux     = 'HLL'                # par de Kurganov en rhoCentralFoam
shock    = 'Off' if stab == 'dg' else 'Physical'
mu0      = 1.0

# Paso de tiempo: el CFL arranca en cfl y se multiplica por cfl_growth cada paso hasta cfl_end
cfl        = PENDIENTE          # los cuatro salen de la corrida piloto
cfl_end    = PENDIENTE
cfl_growth = PENDIENTE
steps      = PENDIENTE          # pasos totales; la parada la decide [post]
info_steps  = max(1, steps//2000)
force_steps = max(1, steps//2000)
chk_steps   = max(1, steps//10)

[run]
probe     = command -v CompressibleFlowSolver
prepare   = mkdir -p {case} &&
            python3 {tools}/render.py {run} {carpeta}/plantilla/conditions.xml {case}/conditions.xml &&
            cp {carpeta}/mallas/L{level}.xml {case}/mesh.xml
command   = {mpi} {procs} CompressibleFlowSolver mesh.xml conditions.xml
watch     = case/forces.fce
timeout_s = 259200
stall_s   = 1800
poll_s    = 30

[post]
forces = {case}/forces.fce
log    = {run}/log
mesh   = {carpeta}/mallas/L{level}.xml
dof    = celdas*(P+1)**2
dim    = 2
unit   = conv
window = 5
tol_cd = 1e-5                   # C5 provisoria
tol_cl = 1e-4

[report]
kind      = cost_curve
group     = mach
family    = solver stab
level     = level
order     = P
quantity  = cd
ratio     = 2
reference = stab=dg
