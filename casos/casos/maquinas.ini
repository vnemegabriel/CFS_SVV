# Una sección por máquina. `hosts` admite comodines para los nodos de un cluster.
# var_X queda disponible como {X} en las plantillas de los casos.
# taubench_s vacío: el costo normalizado queda vacío hasta calibrar la máquina.

[nemepad]
hosts          = nemepad
procs          = 8
runs_root      = ~/runs
taubench_s     =
submit         = local
var_mpi        = mpirun --bind-to core -np
var_aconcagua  = /mnt/c/Users/valne/OneDrive/CFD-ITBA-ROCKETRY
env_nektar     = export PATH=/opt/nektar++/bin:$PATH
                 export LD_LIBRARY_PATH=/opt/nektar++/lib64:$LD_LIBRARY_PATH
env_openfoam   = source /usr/lib/openfoam/openfoam2412/etc/bashrc

# Build de construcción (rama feature/svv-cfs). Elegir con CAMP_MAQUINA=nemepad-dev.
[nemepad-dev]
hosts          = nemepad
procs          = 8
runs_root      = ~/runs-dev
taubench_s     =
submit         = local
var_mpi        = mpirun --bind-to core -np
var_aconcagua  = /mnt/c/Users/valne/OneDrive/CFD-ITBA-ROCKETRY
env_nektar     = export PATH=$HOME/nektar/build-svv/dist/bin:$PATH
                 export LD_LIBRARY_PATH=$HOME/nektar/build-svv/dist/lib64:$LD_LIBRARY_PATH
env_openfoam   = source /usr/lib/openfoam/openfoam2412/etc/bashrc

# Cluster: gestor de colas sin definir. submit es el comando de envío,
# {job} el script que arma `casos.py submit`, job_header su encabezado.
#
# [cluster]
# hosts         = login* nodo*
# procs         = 32
# runs_root     = /scratch/USUARIO/runs
# taubench_s    =
# submit        = sbatch {job}
# job_header    = ~/casos/job_header.sh
# var_mpi       = srun -n
# var_aconcagua = /home/USUARIO/CFD-ITBA-ROCKETRY
# env_nektar    = module load nektar
# env_openfoam  = module load openfoam/2412
