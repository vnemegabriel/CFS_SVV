# Verificación, V2–V4 de CASOS.md. Sesiones del test suite de Nektar++ (generar.sh).
# Sin SVV todavía: el filtro entra como otro valor de la columna stab.

[caso]
solver = nektar
id     = {caso}_{stab}_P{P}

[sweep]
# caso, sesión de origen, mu y difusión (sólo V2, que se porta de Euler a Navier–Stokes)
caso,sesion,mu,difusion = V2axial,SquareDomain_Euler_2D_AxialFlow,PENDIENTE,PENDIENTE
                          V2diagonal,SquareDomain_Euler_2D_DiagonalFlow,PENDIENTE,PENDIENTE
                          V3,Couette_WeakDG_LDG_SEM,-,-
                          V4,MMS_Compressible_Poiseuille_testIP,-,-
stab = dg
P    = 1 2 3 4

[values]
nummodes = P + 1
eq       = 'NavierStokesCFE'
Pr       = 0.72
procs    = 1
# V4: Euler explícito con paso fijo diverge en P >= 3. Paso /4 por orden, mismo tiempo final 0.025 s.
# Medido en P = 3: con paso/4 y paso/16 la norma L2 coincide en 6 cifras (error temporal despreciable).
extra    = ('-P TimeStep=%g -P NumSteps=%d' % (2.5e-5*4**min(0, 2 - P), 1000*4**max(0, P - 2))) if caso == 'V4' else ''

[run]
probe     = command -v CompressibleFlowSolver
prepare   = mkdir -p {case} &&
            python3 {tools}/render.py {run} {carpeta}/plantilla/{sesion}.xml {case}/session.xml
command   = {mpi} {procs} CompressibleFlowSolver session.xml -P IO_InfoSteps=10 {extra}
timeout_s = 1800
stall_s   = 600
poll_s    = 5

[post]
kind = errores
log  = {run}/log

[report]
kind    = errores
case    = caso
columns = caso stab P

[criteria]
V2axial    = linf <= 1e-12
V2diagonal = linf <= 1e-12
V3         = igual stab=dg tol=1e-10
V4         = orden h variable=rhou margen=0.3
