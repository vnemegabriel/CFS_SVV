# Calibración, C2 de CASOS.md: tubo de choque 2D con malla mixta, sesiones del test suite (generar.sh).
# stab = base es el mecanismo propio de cada sesión. SVV entra como otro valor de stab.

[caso]
solver = nektar
id     = tubo_{sesion}_{stab}

[sweep]
sesion = AV_Lap AV_Lap_NS
         AV_Phys_Dil_IP_AUSM0 AV_Phys_Dil_IP_AUSM1 AV_Phys_Dil_IP_AUSM2 AV_Phys_Dil_IP_AUSM3
         AV_Phys_Dil_IP_ExactToro AV_Phys_Dil_IP_HLL AV_Phys_Dil_IP_HLLC
         AV_Phys_Dil_IP_LaxFriedrichs AV_Phys_Dil_IP_Roe
         AV_Phys_Dil_IP_Impl AV_Phys_Dil_LDGNS AV_Phys_Mod_IP AV_Phys_Mod_LDGNS
stab   = base

[values]
t_final    = PENDIENTE          # las sesiones originales corren 1e-8 a 1e-7 s
dt         = PENDIENTE
method     = 'RungeKutta'       # mismo integrador en la terna; la implícita no lo usa
order      = 4
steps      = int(round(t_final/dt))
info_steps = max(1, steps//200)
procs      = 2

[run]
probe     = command -v CompressibleFlowSolver
prepare   = mkdir -p {case} &&
            python3 {tools}/render.py {run} {carpeta}/plantilla/{sesion}.xml {case}/session.xml &&
            cp {carpeta}/plantilla/ShockTube_2D_mixedMesh.xml {case}/mesh.xml
command   = {mpi} {procs} CompressibleFlowSolver mesh.xml session.xml
timeout_s = 7200
stall_s   = 900
poll_s    = 10

[post]
kind = errores
log  = {run}/log

[report]
kind    = errores
columns = sesion stab
